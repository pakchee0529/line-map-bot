<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>複数電柱マップ</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  />
  <style>
    html, body, #map {
      height: 100%;
      margin: 0;
      padding: 0;
    }
    /* 2点径間: 常時表示の小さめラベル（ピンの上、コンパクト） */
    .leaflet-tooltip.span-two-tt {
      margin-top: -6px !important;
      padding: 2px 6px !important;
      font-size: 11px !important;
      line-height: 1.2 !important;
      font-weight: 500;
      border: 1px solid rgba(0, 0, 0, 0.12) !important;
      border-radius: 3px;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.15);
      background: rgba(255, 255, 255, 0.96) !important;
      color: #111 !important;
      max-width: 10rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      pointer-events: auto;
    }
    .span-two-tip-hit {
      color: inherit;
      text-decoration: none;
      display: block;
      max-width: 10rem;
      overflow: hidden;
      text-overflow: ellipsis;
    }
  </style>
</head>
<body>
  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const points = {{ points|tojson }};
    const isTwoPointMode = {{ is_two_point_mode|default(false)|tojson }};

    const map = L.map('map');

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    const bounds = [];

    function escapeHtml(s) {
      return String(s)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/"/g, "&quot;");
    }

    points.forEach(p => {
      const marker = L.marker([p.lat, p.lng]).addTo(map);

      const googleUrl = `https://www.google.com/maps?q=${p.lat},${p.lng}`;
      if (isTwoPointMode) {
        const gurl = p.google_url || googleUrl;
        const label = escapeHtml(p.name != null ? p.name : "");
        const tipHtml = `<a class="span-two-tip-hit" href="${gurl}" target="_blank" rel="noopener noreferrer">${label}</a>`;
        marker.bindTooltip(tipHtml, {
          permanent: true,
          direction: "top",
          offset: [0, -6],
          opacity: 1,
          className: "span-two-tt",
          interactive: true,
        });
      } else {
        const roleLine = p.role
          ? `<div style="font-weight:600;margin-bottom:4px;">${p.role}</div>`
          : "";
        const popupHtml = `
  <div>
    ${roleLine}
    <div>${p.name}</div>
    <div style="margin-top: 6px;">
      <a href="${googleUrl}" target="_blank" rel="noopener noreferrer"
         onclick="return confirm('Googleマップで開きますか？');">
        Googleマップで開く
      </a>
    </div>
  </div>
`;
        marker.bindPopup(popupHtml);
      }

      bounds.push([p.lat, p.lng]);
    });

    if (bounds.length === 1) {
      map.setView(bounds[0], 18);
    } else {
      map.fitBounds(bounds, {
        padding: [30, 30],
        maxZoom: 18
      });
    }
  </script>
</body>
</html>
