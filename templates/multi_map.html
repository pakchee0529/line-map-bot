<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>複数電柱マップ</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  />
  <style>
    html, body, #map {
      height: 100%;
      margin: 0;
      padding: 0;
    }
    .leaflet-popup.span-two-popup .leaflet-popup-content-wrapper {
      padding: 0;
      border-radius: 4px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.25);
    }
    .leaflet-popup.span-two-popup .leaflet-popup-content {
      margin: 0;
      padding: 3px 8px;
      line-height: 1.25;
      font-size: 12px;
      min-width: 0;
    }
    .leaflet-popup.span-two-popup .leaflet-popup-tip-container {
      margin-top: -1px;
    }
    .span-two-hit {
      display: block;
      max-width: 11rem;
      color: #111;
      text-decoration: none;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
  </style>
</head>
<body>
  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const points = {{ points|tojson }};
    const isTwoPointMode = {{ is_two_point_mode|default(false)|tojson }};

    const map = L.map('map');

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    const bounds = [];
    const twoPointMarkers = [];

    function escapeHtml(s) {
      return String(s)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/"/g, "&quot;");
    }

    points.forEach(p => {
      const marker = L.marker([p.lat, p.lng]).addTo(map);

      const googleUrl = `https://www.google.com/maps?q=${p.lat},${p.lng}`;
      if (isTwoPointMode) {
        const gurl = p.google_url || googleUrl;
        const label = escapeHtml(p.name != null ? p.name : "");
        const compact = `<a class="span-two-hit" href="${gurl}" target="_blank" rel="noopener noreferrer">${label}</a>`;
        marker.bindPopup(compact, {
          className: "span-two-popup",
          offset: [0, -10],
          autoPan: true,
          autoPanPadding: [12, 12],
          autoClose: false,
          closeOnClick: false,
        });
        twoPointMarkers.push(marker);
      } else {
        const roleLine = p.role
          ? `<div style="font-weight:600;margin-bottom:4px;">${p.role}</div>`
          : "";
        const popupHtml = `
  <div>
    ${roleLine}
    <div>${p.name}</div>
    <div style="margin-top: 6px;">
      <a href="${googleUrl}" target="_blank" rel="noopener noreferrer"
         onclick="return confirm('Googleマップで開きますか？');">
        Googleマップで開く
      </a>
    </div>
  </div>
`;
        marker.bindPopup(popupHtml);
      }

      bounds.push([p.lat, p.lng]);
    });

    if (bounds.length === 1) {
      map.setView(bounds[0], 18);
    } else {
      map.fitBounds(bounds, {
        padding: [30, 30],
        maxZoom: 18
      });
    }

    if (isTwoPointMode && twoPointMarkers.length) {
      twoPointMarkers.forEach(m => m.openPopup());
    }
  </script>
</body>
</html>
